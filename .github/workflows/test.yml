name: Rust Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cargo-test:
    # Each matrix entry names its own check. Do not let GitHub generate these
    # names: "cargo test" is a required status check in
    # .github/branch-protection-main.json, so renaming it would block every PR.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSRV gate: proves the rust-version promise in Cargo.toml still holds.
          - toolchain: "1.88.0"
            name: cargo test
          # Current stable: catches upstream breakage early. Informational --
          # not a required check, so a fresh Rust release cannot block PRs.
          - toolchain: stable
            name: cargo test (stable)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test default features and doctests
        run: cargo test --locked
      - name: Test optional features and doctests
        run: cargo test --locked --features search,serde,arbitrary
      # The API docs demonstrate crossterm 0.29. Run their doctests above;
      # test each alternative backend without those backend-specific snippets.
      - name: Test crossterm 0.28
        run: cargo test --locked --no-default-features --features crossterm_0_28,search,serde,arbitrary --lib --tests
      - name: Test without a backend
        run: cargo test --locked --no-default-features --features no-backend,search,serde,arbitrary --lib --tests
      - name: Test termwiz
        run: cargo test --locked --no-default-features --features termwiz,search,serde,arbitrary --lib --tests
      - name: Test termion
        run: cargo test --locked --no-default-features --features termion,search,serde,arbitrary --lib --tests
