name: Cross Platform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cross-platform:
    name: cross-platform Windows (${{ matrix.toolchain }})
    # Linux is covered by test.yml; avoid repeating its default test job here.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.88.0"
          - stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz
      - name: Test default features and doctests
        run: cargo test --locked
      - name: Test optional features and doctests
        run: cargo test --locked --features search,serde,arbitrary
      - name: Verify deliberate fuzz seeds
        run: cargo run --manifest-path fuzz/Cargo.toml --locked --no-default-features --example seed_corpus -- --check
      - name: Replay all fuzz seeds without a sanitizer
        run: cargo run --manifest-path fuzz/Cargo.toml --locked --no-default-features --example replay -- --seeds
