name: Cross Platform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cross-platform:
    name: cross-platform Windows (${{ matrix.toolchain }})
    # Linux is covered by test.yml; avoid repeating its default test job here.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.88.0"
          - stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test default features and doctests
        run: cargo test --locked
      - name: Test optional features and doctests
        run: cargo test --locked --features search,serde,arbitrary
