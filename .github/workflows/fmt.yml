name: Rust Format

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cargo-fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # MSRV gate -- matches rust-version in Cargo.toml.
          toolchain: "1.88.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Check fuzz target formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
