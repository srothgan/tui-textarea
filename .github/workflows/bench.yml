name: Benchmark Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: benchmark validation (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: benchmarks
      - name: Lint benchmark targets
        run: cargo clippy --locked -p tui-textarea-bench --all-targets -- -D warnings
      # This compiles every target and executes its workload assertions, without timing samples.
      - name: Validate optimized benchmark workloads
        run: cargo bench --locked -p tui-textarea-bench --benches -- --test
