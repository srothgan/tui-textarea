version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
      - cargo
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # The ratatui crates must move in lockstep: ratatui, ratatui-core and
      # ratatui-widgets are split halves of one release. Listed first so it
      # wins over cargo-non-major, and matching all update types because a
      # 0.x bump is breaking under cargo semver even though Dependabot labels
      # it "minor" -- without this group it would hide inside the batch below.
      ratatui:
        applies-to: version-updates
        patterns:
          - "ratatui"
          - "ratatui-*"
      # Batch routine bumps into one reviewable PR. Major bumps stay ungrouped
      # so each breaking change arrives on its own.
      cargo-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      github-actions-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
