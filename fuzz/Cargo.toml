[package]
name = "tui-textarea-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.88.0"
autobins = false

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing"]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
tui-textarea = { package = "tui-textarea-2", path = "..", default-features = false, features = ["no-backend", "search"] }
ratatui-core = { version = "0.1.0", default-features = false }
ratatui-widgets = { version = "0.3.0", default-features = false }
regex = "1"

[workspace]
members = ["."]

[[bin]]
name = "editing_history"
path = "fuzz_targets/editing_history.rs"
required-features = ["fuzzing"]
test = false
doc = false

[[bin]]
name = "selection_atomic"
path = "fuzz_targets/selection_atomic.rs"
required-features = ["fuzzing"]
test = false
doc = false

[[bin]]
name = "layout"
path = "fuzz_targets/layout.rs"
required-features = ["fuzzing"]
test = false
doc = false

[[bin]]
name = "search"
path = "fuzz_targets/search.rs"
required-features = ["fuzzing"]
test = false
doc = false
