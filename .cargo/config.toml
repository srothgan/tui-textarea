[alias]
watch-check = ["watch", "--why", "-x", "clippy --locked --all-targets -- -D warnings", "-x", "clippy --locked --all-targets --features=search,serde,arbitrary -- -D warnings", "-x", "clippy --locked --all-targets --no-default-features --features=crossterm_0_28,search,serde,arbitrary -- -D warnings", "-x", "clippy --locked --all-targets --no-default-features --features=no-backend,search,serde,arbitrary -- -D warnings", "-x", "clippy --locked --all-targets --no-default-features --features=termwiz,search,serde,arbitrary -- -D warnings"]
watch-test = ["watch", "--why", "-x", "test --locked", "-x", "test --locked --features=search,serde,arbitrary", "-x", "test --locked --no-default-features --features=crossterm_0_28,search,serde,arbitrary --lib --tests", "-x", "test --locked --no-default-features --features=no-backend,search,serde,arbitrary --lib --tests", "-x", "test --locked --no-default-features --features=termwiz,search,serde,arbitrary --lib --tests"]
watch-check-termion = ["watch", "--why", "-x", "clippy --locked --all-targets --no-default-features --features=termion,search,serde,arbitrary -- -D warnings"]
watch-test-termion = ["watch", "--why", "-x", "test --locked --no-default-features --features=termion,search,serde,arbitrary --lib --tests"]
