[package]
name = "tui-textarea-bench"
version = "0.0.0"
edition = "2021"
rust-version = "1.88.0"
publish = false
license = "MIT"
autobenches = false

[lib]
bench = false

[dependencies]
tui-textarea = { package = "tui-textarea-2", path = "..", default-features = false, features = ["no-backend", "search"] }
ratatui = { version = "0.30.0", default-features = false }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "cursor"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "history"
harness = false

[[bench]]
name = "search"
harness = false
